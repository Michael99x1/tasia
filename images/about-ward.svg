<svg viewBox="0 0 640 800" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <rect width="640" height="800" fill="#E4EFEB"/>

  <!-- back wall -->
  <rect x="0" y="0" width="640" height="520" fill="#D6E6E0"/>
  <rect x="0" y="500" width="640" height="300" fill="#F4F8F6"/>
  <rect x="0" y="500" width="640" height="8" fill="#0B4F45" opacity="0.15"/>

  <!-- window -->
  <rect x="80" y="70" width="180" height="220" rx="6" fill="#9FC9BE"/>
  <rect x="80" y="70" width="180" height="220" rx="6" fill="none" stroke="#0B4F45" stroke-width="3"/>
  <line x1="170" y1="70" x2="170" y2="290" stroke="#0B4F45" stroke-width="3"/>
  <line x1="80" y1="180" x2="260" y2="180" stroke="#0B4F45" stroke-width="3"/>

  <!-- wall cross emblem -->
  <g transform="translate(460,140)">
    <circle r="70" fill="#0B4F45"/>
    <rect x="-10" y="-38" width="20" height="76" rx="4" fill="#D9A441"/>
    <rect x="-38" y="-10" width="76" height="20" rx="4" fill="#D9A441"/>
  </g>

  <!-- hospital bed -->
  <g transform="translate(90,480)">
    <rect x="0" y="60" width="300" height="16" rx="4" fill="#0B4F45"/>
    <rect x="10" y="0" width="280" height="70" rx="10" fill="#FFFFFF" stroke="#DDE3DE" stroke-width="2"/>
    <rect x="10" y="0" width="280" height="20" rx="10" fill="#146B5B" opacity="0.15"/>
    <rect x="20" y="-26" width="60" height="34" rx="8" fill="#F5EFE1"/>
    <rect x="0" y="60" width="16" height="40" fill="#0B4F45"/>
    <rect x="284" y="60" width="16" height="40" fill="#0B4F45"/>
  </g>

  <!-- IV stand -->
  <g transform="translate(420,430)">
    <line x1="0" y1="0" x2="0" y2="150" stroke="#146B5B" stroke-width="4"/>
    <line x1="-30" y1="150" x2="30" y2="150" stroke="#146B5B" stroke-width="4"/>
    <line x1="-3" y1="0" x2="30" y2="-40" stroke="#146B5B" stroke-width="4"/>
    <circle cx="30" cy="-50" r="16" fill="#9FC9BE" stroke="#146B5B" stroke-width="2"/>
  </g>

  <!-- side table with plant -->
  <g transform="translate(50,560)">
    <rect x="0" y="0" width="46" height="46" fill="#0E5E51"/>
    <ellipse cx="23" cy="-6" rx="16" ry="8" fill="#5FA98F"/>
    <rect x="14" y="-14" width="18" height="14" fill="#B98A2E"/>
  </g>

  <!-- caduceus / medical monitor icon -->
  <g transform="translate(540,560)">
    <rect x="-40" y="-30" width="80" height="60" rx="8" fill="#0B4F45"/>
    <polyline points="-28,4 -14,4 -6,-14 4,20 12,-6 24,4 30,4" fill="none" stroke="#5FD6B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- floor accent line -->
  <rect x="0" y="500" width="640" height="4" fill="#D9A441" opacity="0.5"/>
</svg>
