<svg width="640" height="200" viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .word { font-family: 'Georgia', 'Times New Roman', serif; }
    </style>
  </defs>

  <!-- Mark: circular badge with rod-of-Asclepius / medical cross motif -->
  <g transform="translate(20,20)">
    <circle cx="80" cy="80" r="78" fill="#0B4F45"/>
    <circle cx="80" cy="80" r="78" fill="none" stroke="#D9A441" stroke-width="3"/>

    <!-- staff -->
    <line x1="80" y1="34" x2="80" y2="126" stroke="#F5EFE1" stroke-width="5" stroke-linecap="round"/>
    <!-- serpent coils (simplified rod of Asclepius) -->
    <path d="M80 44 C 58 52, 58 68, 80 76 C 102 84, 102 100, 80 108 C 58 116, 58 118, 62 122"
          fill="none" stroke="#D9A441" stroke-width="5" stroke-linecap="round"/>
    <!-- serpent head -->
    <circle cx="62" cy="122" r="4.5" fill="#D9A441"/>
    <!-- wings top -->
    <path d="M80 40 C 62 26, 40 30, 34 44 C 46 44, 58 42, 80 50 Z" fill="#F5EFE1"/>
    <path d="M80 40 C 98 26, 120 30, 126 44 C 114 44, 102 42, 80 50 Z" fill="#F5EFE1"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(210,0)">
    <text x="0" y="98" class="word" font-size="52" font-weight="600" fill="#0B4F45" letter-spacing="0.5">Tasia</text>
    <text x="0" y="148" class="word" font-size="30" fill="#0B4F45" letter-spacing="6">HOSPITAL</text>
    <rect x="2" y="160" width="230" height="3" fill="#D9A441"/>
    <text x="2" y="182" font-family="Arial, sans-serif" font-size="13" fill="#146B5B" letter-spacing="1.5">PRIVATE HOSPITAL &amp; CLINICS</text>
  </g>
</svg>
